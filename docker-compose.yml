# =============================================================================
# NIKE ENTERPRISE PLATFORM — Docker Compose
# =============================================================================
# Ubuntu Server 24.04 LTS | Intel i5-10400F | 16 GB RAM
# Todas las imágenes con versión fija. Sin :latest.
# =============================================================================
# Servicios: 19 (11 infraestructura + 8 plataforma logística)
# =============================================================================

networks:
  frontend:
    name: nike_frontend
    driver: bridge
  backend:
    name: nike_backend
    driver: bridge
  monitoring:
    name: nike_monitoring
    driver: bridge
  identity:
    name: nike_identity
    driver: bridge
  vpn:
    name: nike_vpn
    driver: bridge
  nike_logistica:
    name: nike_logistica_network
    driver: bridge

volumes:
  # Infraestructura
  postgres_data:
    name: nike_postgres_data
  keycloak_data:
    name: nike_keycloak_data
  gitea_data:
    name: nike_gitea_data
  grafana_data:
    name: nike_grafana_data
  prometheus_data:
    name: nike_prometheus_data
  portainer_data:
    name: nike_portainer_data
  adguard_work:
    name: nike_adguard_work
  adguard_conf:
    name: nike_adguard_conf
  wireguard_data:
    name: nike_wireguard_data
  traefik_certs:
    name: nike_traefik_certs
  # Plataforma logística
  postgres_central_data:
    name: nike_postgres_central
  postgres_sede_data:
    name: nike_postgres_sede_peru
  postgres_retail_data:
    name: nike_postgres_retail
  postgres_supply_data:
    name: nike_postgres_supply_chain
  redis_data:
    name: nike_redis_data
  pgadmin_data:
    name: nike_pgadmin_data

services:
  # ===========================================================================
  # INFRAESTRUCTURA CORPORATIVA
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # TRAEFIK — Reverse Proxy
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:${TRAEFIK_VERSION}
    container_name: nike-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_certs:/certs
    networks:
      frontend:
        aliases:
          - auth.nike.com
      identity:
      monitoring:
      backend:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
        reservations:
          memory: 64M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN_SUFFIX}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=web"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # ADGUARD HOME — DNS Interno + Bloqueo de Ads
  # ---------------------------------------------------------------------------
  adguard:
    image: adguard/adguardhome:${ADGUARD_VERSION}
    container_name: nike-adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3053:3000/tcp"
    volumes:
      - adguard_work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adguard.rule=Host(`adguard.${DOMAIN_SUFFIX}`)"
      - "traefik.http.routers.adguard.entrypoints=web"
      - "traefik.http.services.adguard.loadbalancer.server.port=3000"
      - "traefik.docker.network=nike_frontend"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # POSTGRESQL — Base de Datos Infraestructura (keycloak, gitea, grafana)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: nike-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      TZ: ${TIMEZONE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "1.00"
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # KEYCLOAK — Identity Provider (OIDC / OAuth2)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    container_name: nike-keycloak
    restart: unless-stopped
    command:
      - start
      - --http-enabled=true
      - --hostname-strict=true
      - --proxy-headers=xforwarded
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_PORT: ${KC_HTTP_PORT}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_LOG_LEVEL: info
      TZ: ${TIMEZONE}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - backend
      - identity
      - frontend
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "1.00"
        reservations:
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`auth.${DOMAIN_SUFFIX}`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      - "traefik.docker.network=nike_frontend"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # GITEA — Repositorio Git
  # ---------------------------------------------------------------------------
  gitea:
    image: gitea/gitea:${GITEA_VERSION}
    container_name: nike-gitea
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: ${GITEA_DB_TYPE}
      GITEA__database__HOST: ${GITEA_DB_HOST}
      GITEA__database__NAME: ${GITEA_DB_NAME}
      GITEA__database__USER: ${GITEA_DB_USER}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWD}
      GITEA__server__DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT}
      GITEA__server__SSH_LISTEN_PORT: "22"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN}
      TZ: ${TIMEZONE}
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${GITEA_SSH_PORT}:22"
    networks:
      - backend
      - frontend
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.50"
        reservations:
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`git.${DOMAIN_SUFFIX}`)"
      - "traefik.http.routers.gitea.entrypoints=web"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
      - "traefik.docker.network=nike_frontend"
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # PORTAINER CE — Gestión Docker
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:${PORTAINER_VERSION}
    container_name: nike-portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN_SUFFIX}`)"
      - "traefik.http.routers.portainer.entrypoints=web"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.docker.network=nike_frontend"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # PROMETHEUS — Métricas
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: nike-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE}"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.50"
        reservations:
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN_SUFFIX}`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.docker.network=nike_frontend"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # GRAFANA — Dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: nike-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL}
      GF_SERVER_DOMAIN: ${GF_SERVER_DOMAIN}
      GF_DATABASE_TYPE: ${GF_DATABASE_TYPE}
      GF_DATABASE_HOST: ${GF_DATABASE_HOST}
      GF_DATABASE_NAME: ${GF_DATABASE_NAME}
      GF_DATABASE_USER: ${GF_DATABASE_USER}
      GF_DATABASE_PASSWORD: ${GF_DATABASE_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_MODE: console
      GF_LOG_LEVEL: info
      TZ: ${TIMEZONE}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.50"
        reservations:
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN_SUFFIX}`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.docker.network=nike_frontend"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # NODE EXPORTER — Métricas del Host
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    container_name: nike-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---------------------------------------------------------------------------
  # WIREGUARD (wg-easy) — VPN
  # ---------------------------------------------------------------------------
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:${WGEASY_VERSION}
    container_name: nike-wireguard
    restart: unless-stopped
    environment:
      INSECURE: "true"
      INIT_ENABLED: "true"
      INIT_PASSWORD: ${WG_PASSWORD}
      INIT_HOST: ${WG_HOST}
      INIT_PORT: ${WG_PORT}
      INIT_DNS: ${WG_DEFAULT_DNS}
      INIT_IPV4_CIDR: 10.8.0.0/24
    volumes:
      - wireguard_data:/etc/wireguard
    ports:
      - "${WG_PORT}:${WG_PORT}/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - vpn
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wireguard.rule=Host(`vpn.${DOMAIN_SUFFIX}`)"
      - "traefik.http.routers.wireguard.entrypoints=web"
      - "traefik.http.services.wireguard.loadbalancer.server.port=51821"
      - "traefik.docker.network=nike_frontend"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:51821"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # PORTAL — Aplicación Pública
  # ---------------------------------------------------------------------------
  portal:
    image: nginx:${NGINX_VERSION}
    container_name: nike-portal
    restart: unless-stopped
    volumes:
      - ./portal/html:/usr/share/nginx/html:ro
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.10"
        reservations:
          memory: 32M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal.rule=Host(`portal.${DOMAIN_SUFFIX}`)"
      - "traefik.http.routers.portal.entrypoints=web"
      - "traefik.http.services.portal.loadbalancer.server.port=80"
      - "traefik.docker.network=nike_frontend"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ===========================================================================
  # PLATAFORMA LOGÍSTICA — Bases de Datos
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # DB 1 — CENTRAL (pgvector)
  # ---------------------------------------------------------------------------
  postgres_central:
    image: pgvector/pgvector:${PGVECTOR_VERSION}
    container_name: nike_db_central
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_CENTRAL_USER}
      POSTGRES_PASSWORD: ${DB_CENTRAL_PASSWORD}
      POSTGRES_DB:       ${DB_CENTRAL_NAME}
    volumes:
      - postgres_central_data:/var/lib/postgresql/data
      - ./db/01_platform_central.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - nike_logistica
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "0.50"
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_CENTRAL_USER} -d ${DB_CENTRAL_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # DB 2 — SEDE PERU
  # ---------------------------------------------------------------------------
  postgres_sede_peru:
    image: postgres:16-alpine
    container_name: nike_db_sede_peru
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_SEDE_USER}
      POSTGRES_PASSWORD: ${DB_SEDE_PASSWORD}
      POSTGRES_DB:       ${DB_SEDE_NAME}
    volumes:
      - postgres_sede_data:/var/lib/postgresql/data
      - ./db/02_sede_nike_peru.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - nike_logistica
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.25"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_SEDE_USER} -d ${DB_SEDE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # DB 3 — RETAIL
  # ---------------------------------------------------------------------------
  postgres_retail:
    image: postgres:16-alpine
    container_name: nike_db_retail
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_RETAIL_USER}
      POSTGRES_PASSWORD: ${DB_RETAIL_PASSWORD}
      POSTGRES_DB:       ${DB_RETAIL_NAME}
    volumes:
      - postgres_retail_data:/var/lib/postgresql/data
      - ./db/03_retail_distribuidoras.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - nike_logistica
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.25"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_RETAIL_USER} -d ${DB_RETAIL_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # DB 4 — SUPPLY CHAIN
  # ---------------------------------------------------------------------------
  postgres_supply_chain:
    image: postgres:16-alpine
    container_name: nike_db_supply_chain
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_SUPPLY_USER}
      POSTGRES_PASSWORD: ${DB_SUPPLY_PASSWORD}
      POSTGRES_DB:       ${DB_SUPPLY_NAME}
    volumes:
      - postgres_supply_data:/var/lib/postgresql/data
      - ./db/04_proveedores_fabricas.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - nike_logistica
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.25"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_SUPPLY_USER} -d ${DB_SUPPLY_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # REDIS — Caché Semántica
  # ---------------------------------------------------------------------------
  redis:
    image: redis:${REDIS_ALPINE_VERSION}
    container_name: nike_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - nike_logistica
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.25"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # PLATAFORMA LOGÍSTICA — Aplicaciones
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # BACKEND — API FastAPI
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    container_name: nike-backend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV}
      - APP_PORT=8000
      - APP_HOST=0.0.0.0
      - SECRET_KEY=${SECRET_KEY}
      - DEMO_MODE=${DEMO_MODE}
      - DEMO_ROLE_HEADER=${DEMO_ROLE_HEADER:-X-Demo-Role}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - DATABASE_URL_CENTRAL=postgresql+asyncpg://${DB_CENTRAL_USER}:${DB_CENTRAL_PASSWORD}@postgres_central:5432/${DB_CENTRAL_NAME}
      - DATABASE_URL_SEDE=postgresql+asyncpg://${DB_SEDE_USER}:${DB_SEDE_PASSWORD}@postgres_sede_peru:5432/${DB_SEDE_NAME}
      - DATABASE_URL_RETAIL=postgresql+asyncpg://${DB_RETAIL_USER}:${DB_RETAIL_PASSWORD}@postgres_retail:5432/${DB_RETAIL_NAME}
      - DATABASE_URL_SUPPLY=postgresql+asyncpg://${DB_SUPPLY_USER}:${DB_SUPPLY_PASSWORD}@postgres_supply_chain:5432/${DB_SUPPLY_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KEYCLOAK_ENABLED=${KEYCLOAK_ENABLED}
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - GROQ_MAX_TOKENS=${GROQ_MAX_TOKENS:-2048}
      - GROQ_TEMPERATURE=${GROQ_TEMPERATURE:-0.3}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-384}
      - VECTOR_SIMILARITY_THRESHOLD=${VECTOR_SIMILARITY_THRESHOLD:-0.95}
    volumes:
      - ./backend/app:/workspace/app
    depends_on:
      postgres_central:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nike_logistica
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-api.rule=Host(`api.${DOMAIN_SUFFIX}`)"
      - "traefik.http.routers.backend-api.entrypoints=web"
      - "traefik.http.services.backend-api.loadbalancer.server.port=8000"
      - "traefik.docker.network=nike_frontend"
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.00"
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # FRONTEND — React + Vite (reemplaza intranet)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    container_name: nike-intranet
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://intranet.${DOMAIN_SUFFIX}/api/v1
      - VITE_PROXY_TARGET=http://backend:8000
      - VITE_KEYCLOAK_ENABLED=${VITE_KEYCLOAK_ENABLED}
      - VITE_KEYCLOAK_URL=http://auth.${DOMAIN_SUFFIX}
      - VITE_KEYCLOAK_REALM=${VITE_KEYCLOAK_REALM}
      - VITE_KEYCLOAK_CLIENT_ID=${VITE_KEYCLOAK_CLIENT_ID}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    networks:
      - frontend
      - nike_logistica
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.intranet.rule=Host(`intranet.${DOMAIN_SUFFIX}`)"
      - "traefik.http.routers.intranet.entrypoints=web"
      - "traefik.http.services.intranet.loadbalancer.server.port=5173"
      - "traefik.docker.network=nike_frontend"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # PGADMIN — Panel Visual (OPCIONAL, --profile tools)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nike_pgadmin
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL:              ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD:           ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE:         "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres_central:
        condition: service_healthy
      postgres_sede_peru:
        condition: service_healthy
      postgres_retail:
        condition: service_healthy
      postgres_supply_chain:
        condition: service_healthy
    networks:
      - nike_logistica
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
