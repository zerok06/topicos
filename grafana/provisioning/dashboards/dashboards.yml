# =============================================================================
# GRAFANA — Auto-provisioning: Dashboard Provider
# =============================================================================
# Carga dashboards JSON desde /var/lib/grafana/dashboards
# =============================================================================

apiVersion: 1

providers:
  - name: "Lab Dashboards"
    orgId: 1
    folder: "Lab Platform"
    folderUid: "lab-platform"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
