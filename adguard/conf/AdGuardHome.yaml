# =============================================================================
# ADGUARD HOME — Configuración Inicial
# =============================================================================
# Resolución de dominios .lab apuntando a la IP del servidor.
# DNS upstream para cuando haya Internet disponible.
# =============================================================================

http:
  pprof:
    port: 6060
    enabled: false
  address: 0.0.0.0:3000
  session_ttl: 720h

users:
  - name: admin
    password: $2y$10$abc123examplehashreplacethiswithreal

dns:
  bind_hosts:
    - 0.0.0.0
  port: 53
  anonymize_client_ip: false
  ratelimit: 0
  ratelimit_subnet_len_ipv4: 24
  ratelimit_subnet_len_ipv6: 56
  ratelimit_whitelist: []
  refuse_any: true
  upstream_dns:
    - 1.1.1.1
    - 8.8.8.8
    - 1.0.0.1
    - 8.8.4.4
  upstream_dns_file: ""
  bootstrap_dns:
    - 1.1.1.1
    - 8.8.8.8
  fallback_dns:
    - 1.1.1.1
    - 8.8.8.8
  upstream_mode: load_balance
  fastest_timeout: 1s
  allowed_clients: []
  disallowed_clients: []
  blocked_hosts:
    - version.bind
    - id.server
    - hostname.bind
  trusted_proxies:
    - 127.0.0.0/8
    - ::1/128
  cache_size: 4194304
  cache_ttl_min: 300
  cache_ttl_max: 86400
  cache_optimistic: true
  bogus_nxdomain: []
  aaaa_disabled: false
  enable_dnssec: true
  edns_client_subnet:
    custom_ip: ""
    enabled: false
    use_custom: false
  max_goroutines: 300
  handle_ddr: true
  ipset: []
  ipset_file: ""
  bootstrap_prefer_ipv6: false
  upstream_timeout: 10s
  private_networks: []
  use_private_ptr_resolvers: true
  local_ptr_upstreams: []
  use_dns64: false
  dns64_prefixes: []
  serve_http3: false
  use_http3_upstreams: false
  serve_plain_dns: true
  hostsfile_enabled: true

filtering:
  blocking_ipv4: ""
  blocking_ipv6: ""
  blocked_services:
    schedule:
      time_zone: America/Bogota
    ids: []
  protection_disabled_until: null
  safe_search:
    enabled: false
  blocking_mode: default
  parental_enabled: false
  safebrowsing_enabled: false
  rewrites:
    # =========================================================================
    # DNS REWRITES — Dominios .nike.com → IP del servidor
    # =========================================================================
    - domain: auth.nike.com
      answer: 192.168.1.100
    - domain: git.nike.com
      answer: 192.168.1.100
    - domain: grafana.nike.com
      answer: 192.168.1.100
    - domain: prometheus.nike.com
      answer: 192.168.1.100
    - domain: portainer.nike.com
      answer: 192.168.1.100
    - domain: intranet.nike.com
      answer: 192.168.1.100
    - domain: portal.nike.com
      answer: 192.168.1.100
    - domain: adguard.nike.com
      answer: 192.168.1.100
    - domain: traefik.nike.com
      answer: 192.168.1.100
    - domain: vpn.nike.com
      answer: 192.168.1.100
    # Wildcard para futuros subdominios
    - domain: "*.nike.com"
      answer: 192.168.1.100
  safebrowsing_cache_size: 1048576
  safesearch_cache_size: 1048576
  parental_cache_size: 1048576
  cache_time: 30
  filters_update_interval: 24
  blocked_response_ttl: 10
  filtering_enabled: true
  filters:
    - enabled: true
      url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
      name: AdGuard DNS filter
      id: 1
    - enabled: true
      url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
      name: AdAway Default Blocklist
      id: 2

tls:
  enabled: false
  server_name: ""
  force_https: false
  port_https: 443
  port_dns_over_tls: 853
  port_dns_over_quic: 784

querylog:
  dir_path: ""
  ignored: []
  interval: 168h
  size_memory: 1000
  enabled: true
  file_enabled: true

statistics:
  dir_path: ""
  ignored: []
  interval: 168h
  enabled: true

os:
  group: ""
  user: ""
  rlimit_nofile: 0

schema_version: 29
